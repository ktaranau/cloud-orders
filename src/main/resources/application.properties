spring.application.name=cloud-orders

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloud_orders}
spring.datasource.username=${DB_USERNAME:cloud_orders}
spring.datasource.password=${DB_PASSWORD:cloud_orders}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8180/realms/cloud-orders}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/cloud-orders/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:cloud-orders-api}